services:
  obsidian-sync:
    build: ./obsidian-sync
    container_name: obsidian-sync
    restart: unless-stopped
    volumes:
      - vault-data:/vault
      - obsidian-config:/root/.config/obsidian-headless
    environment:
      - OBSIDIAN_AUTH_TOKEN=${OBSIDIAN_AUTH_TOKEN:-}
    # Give ob time to disconnect cleanly (release its sync session) before SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      # ob now runs as a child of entrypoint.sh (PID 1 is the shell), so scan
      # every process's cmdline rather than only PID 1.
      test: ["CMD-SHELL", "for f in /proc/[0-9]*/cmdline; do tr '\\0' ' ' < \"$$f\" 2>/dev/null | grep -q 'ob sync --continuous --path /vault' && exit 0; done; exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  agent:
    build: ./agent
    container_name: lazylogger-agent
    restart: unless-stopped
    volumes:
      - vault-data:/vault
    env_file:
      - .env
    environment:
      - MCP_VAULT_PATH=/vault
      - SYSTEM_PROMPT_PATH=/app/system_prompt.md
    depends_on:
      obsidian-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  vault-data:
  obsidian-config:
